# Distinct from sibling projects (avalons_final_stand = 4719) so several backends can run locally.
quarkus.http.port=4720

shoppinglist.info.version=0.1.0

# Root of the file-based JSON storage. Relative to the working directory; gitignored.
shoppinglist.data.dir=data
%test.shoppinglist.data.dir=build/test-data

# Unexpected (500) errors are logged with an error id; only dev also returns exception + stack trace.
shoppinglist.errors.include-stack-trace=false
%dev.shoppinglist.errors.include-stack-trace=true

# jackson-module-kotlin caches handles of Kotlin value classes; making it reloadable avoids
# "loader constraint violation" errors after a dev-mode hot reload.
quarkus.class-loading.reloadable-artifacts=com.fasterxml.jackson.module:jackson-module-kotlin

# CORS for the Vite dev server. The dev server also proxies /api, so this is only a fallback;
# in production the SPA is served from the same origin.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# OpenAPI: the API contract for the web app, the Android app and AI agents. Spec at /q/openapi,
# Swagger UI at /q/swagger-ui (also in production, so agents and developers can explore the API).
quarkus.smallrye-openapi.info-title=Shopping List API
quarkus.smallrye-openapi.info-version=${shoppinglist.info.version}
quarkus.smallrye-openapi.info-description=REST API of the shopping list app, used by the web app, the Android app and AI agents.   Authenticate with `Authorization: Bearer <token>`: either a session token from POST /api/auth/login or a personal   API token (`slt_...`, created by the user in the app settings; read-only tokens may only use GET).   Data model: a user is member of spaces (GET /api/spaces); a space holds shopping lists (GET /api/spaces/{spaceId}/lists),   categories/units (GET /api/spaces/{spaceId}/catalog) and shop layouts (GET /api/spaces/{spaceId}/layouts).   Add an item with POST /api/spaces/{spaceId}/lists/{listId}/items {"name": "Milk"} - the category is filled in from the item history.   Offline clients sync per space: POST /api/spaces/{spaceId}/changes with baseSeq = seq of the last pull,   then GET /api/spaces/{spaceId}/changes?since=<that same baseSeq>.   Errors are JSON {"code", "message"} with a stable code.
# Bearer auth for all @RolesAllowed operations (JWT or personal API token - both are bearer tokens).
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.security-scheme-description=Session token (JWT) from POST /api/auth/login, or a personal API token (slt_...).
quarkus.swagger-ui.always-include=true

# --- Authentication -----------------------------------------------------------------------------------
# HS256 JWT bearer tokens. The committed jwt-dev-secret.jwk is DEV-ONLY; production overrides both key
# locations (Phase 11). Sessions are "sliding": a token lives 30 days and clients exchange it for a fresh
# one via POST /api/auth/refresh. A `sv` (session version) claim lets password changes / "log out
# everywhere" invalidate all older tokens.
mp.jwt.verify.issuer=shopping-list
smallrye.jwt.sign.key.location=jwt-dev-secret.jwk
smallrye.jwt.verify.key.location=jwt-dev-secret.jwk
smallrye.jwt.verify.algorithm=HS256
shoppinglist.auth.jwt.expiration-days=30

# Master email switch. Production verifies emails; dev/test/e2e skip it so no mail server is needed:
# registration auto-verifies and returns a token, the email flows (verify/resend/forgot/reset) return 503.
shoppinglist.auth.email-disabled=false
%dev.shoppinglist.auth.email-disabled=true
%test.shoppinglist.auth.email-disabled=true
%e2e.shoppinglist.auth.email-disabled=true
shoppinglist.auth.email-verification.token-ttl-minutes=1440
shoppinglist.auth.password-reset.token-ttl-minutes=30

# Public origin of the web app; emailed links (verification, password reset) and invite links point here.
shoppinglist.public-base-url=http://localhost:5173

quarkus.mailer.from=Shopping List <noreply@mail.tobias-fassbender.com>
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true
%e2e.quarkus.mailer.mock=true

# Live updates: heartbeat on idle event streams (keeps proxies from closing them).
shoppinglist.events.heartbeat-seconds=25
%test.shoppinglist.events.heartbeat-seconds=1
