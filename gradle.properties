quarkusPluginVersion=3.35.1
quarkusPlatformVersion=3.35.1

# Must match the Kotlin version enforced by the quarkus-bom (Quarkus 3.35.1 -> Kotlin 2.3.21).
# A mismatch breaks incremental Kotlin compilation with a NoSuchMethodError. Verify after a Quarkus bump:
#   ./gradlew :backend:dependencyInsight --configuration compileClasspath --dependency org.jetbrains.kotlin:kotlin-stdlib
kotlinVersion=2.3.21

# Quarkus augmentation + Kotlin compilation need more than the default daemon heap.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
